name: lung_buddy
description: Light-hearted cut-down smoking tracker with a lung buddy mascot.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  intl: any
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  home_widget: ^0.10.0
  in_app_purchase: ^3.3.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/mascot/happy.png
  adaptive_icon_background: "#FFF0F6"
  adaptive_icon_foreground: assets/mascot/happy.png

flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
